<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Crypto Lan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #1a1a2e;
        --bg-secondary: #16213e;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: 'Nunito', sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #app,
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      .build-tag {
        position: fixed;
        bottom: 10px;
        right: 14px;
        font-size: 11px;
        color: var(--text-secondary);
        font-family: 'JetBrains Mono', monospace;
        opacity: 0.45;
        pointer-events: none;
        user-select: none;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
    </div>
    <div class="build-tag" id="build-tag">crypto-lan · proto v0.0.2</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
